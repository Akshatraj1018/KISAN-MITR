    <script>
      // Force cache invalidation so browser never serves stale PWA bundles
      const APP_VER = "km-v4-lang-patch-14nov";
      if (localStorage.getItem("km_cache_ver") !== APP_VER) {
        localStorage.setItem("km_cache_ver", APP_VER);
        if ("caches" in window) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
        }
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
        }
      }
    </script>
